[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Python 3.14, not 3.15: ONNX Runtime has no 3.15 wheels yet (docs/adr/0001).
# Keep in step with python-version in .github/workflows/ci.yml and the base
# image (issue #7): the tests must run on the Python the image ships.
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
