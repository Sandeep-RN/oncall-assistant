name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; later jobs (image, issue #7) raise only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Real Postgres with pgvector for the index tests, the same image the cluster runs (pinned by
    # digest). Throwaway and job-local, so trust auth: no password exists.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # 3.14, not 3.15: ONNX Runtime has no 3.15 wheels yet (docs/adr/0001).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # The model (about 130 MB) is downloaded once per pinned revision and kept in the Actions
      # cache. download.py checks every file's sha256, so a tampered cache cannot pass.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: model-${{ hashFiles('app/embed/model.py') }}
      - run: python -m app.embed.download
      # A skipped test hides a broken setup (no database, no model), so any skip fails the job.
      - name: pytest (no skips allowed)
        run: |
          set -o pipefail
          pytest -q -rs | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then echo "tests were skipped in CI"; exit 1; fi
