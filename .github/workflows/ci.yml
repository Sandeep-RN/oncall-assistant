name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; later jobs (image, issue #7) raise only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # A skipped test hides a broken setup, so any skip fails the job.
      - name: pytest (no skips allowed)
        run: |
          set -o pipefail
          pytest -q -rs | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then echo "tests were skipped in CI"; exit 1; fi
